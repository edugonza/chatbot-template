[package]
name = "matrix-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
futures-util = "0.3"
matrix-sdk = { version = "0.18.0", default-features = false, features = [
    "e2e-encryption",
    "automatic-room-key-forwarding",
    "bundled-sqlite",
] }
pyo3 = { version = "0.29", features = ["abi3-py312"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
lto = "thin"
strip = true
